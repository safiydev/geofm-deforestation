[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geofm-deforestation"
version = "1.0.0"
description = "Geospatial AI for Bitemporal Deforestation Change Detection and EUDR Regulatory Compliance"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Safiyyulloh & Antigravity Remote Sensing Engineering Team", email = "safiydev@users.noreply.github.com" }
]
keywords = [
    "remote-sensing",
    "geospatial-ai",
    "bitemporal-change-detection",
    "deforestation-detection",
    "sentinel-2",
    "sentinel-1",
    "earth-engine",
    "eudr-compliance",
    "lora-peft",
    "pytorch",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "pillow>=9.0.0",
    "pystac>=1.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "tifffile>=2023.1.0",
    "earthengine-api>=0.1.350",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]
studio = [
    "streamlit>=1.25.0",
]
all = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "streamlit>=1.25.0",
    "albumentations>=1.3.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://safiydev.github.io/geofm-deforestation/"
Documentation = "https://safiydev.github.io/geofm-deforestation/"
Repository = "https://github.com/safiydev/geofm-deforestation"
Issues = "https://github.com/safiydev/geofm-deforestation/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geofm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
